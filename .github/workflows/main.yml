name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: |
          unzip Spotifyy.zip
          cd Spotifyy
          echo "android.useAndroidX=true" >> gradle.properties
          gradle assembleDebug --console=plain > ../build.log 2>&1 || { grep -E -A12 "wrong|e: " ../build.log | head -60; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Spotifyy-apk
          path: Spotifyy/app/build/outputs/apk/debug/app-debug.apk
